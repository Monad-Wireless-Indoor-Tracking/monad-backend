services:
  postgres:
    image: postgres:16-alpine
    container_name: monad_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monad_network
    healthcheck:
      test:
        ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
      interval: 10s

  symfony:
    build:
      context: ./backend/monad-backend
      dockerfile: Dockerfile
    container_name: monad_symfony
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      HETZNER_S3_REGION: ${HETZNER_S3_REGION:-eu-central-1}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_PRESIGNED_URL_EXPIRY: ${HETZNER_S3_PRESIGNED_URL_EXPIRY:-+15 minutes}
    ports:
      - "${SYMFONY_PORT}:8000"
    volumes:
      - ./backend/monad-backend:/var/www/html
      - symfony_var:/var/www/html/var
    networks:
      - monad_network
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /var/www/html
    command: sh -c "composer install --no-interaction && (php bin/console lexik:jwt:generate-keypair --skip-if-exists || true) && php -S 0.0.0.0:8000 -t public"

volumes:
  postgres_data:
  symfony_var:

networks:
  monad_network:
    driver: bridge
