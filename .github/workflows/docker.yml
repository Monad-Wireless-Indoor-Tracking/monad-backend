name: Docker build

# Replaces the AWS ECR/EC2 pipeline. The API now runs on the project host alongside the rest of
# the lab (Neo4j, Milvus, PostGIS, the LGTM stack) on the shared `monad` docker network, and the
# image lives in GHCR next to ghcr.io/sibyx/monad-knowledge — one registry, one set of credentials.

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Log into ${{ env.REGISTRY }}
        # Pull requests from forks get no package write token; build without pushing so the
        # Dockerfile is still verified on every PR.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/monad-backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
