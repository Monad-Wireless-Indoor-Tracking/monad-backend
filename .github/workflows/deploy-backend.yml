name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/monad-backend/**'
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: monad-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend/monad-backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 055357411429.dkr.ecr.eu-north-1.amazonaws.com

            cd /app

            # Create docker-compose.yml if not exists
            cat > docker-compose.yml << 'COMPOSE'
            services:
              postgres:
                image: postgres:16-alpine
                container_name: monad_postgres
                environment:
                  POSTGRES_DB: monad
                  POSTGRES_USER: monad
                  POSTGRES_PASSWORD: monad_secure_pwd
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - monad_network
                healthcheck:
                  test: ["CMD", "pg_isready", "-d", "monad", "-U", "monad"]
                  timeout: 5s
                  retries: 5
                  start_period: 60s
                  interval: 10s

              app:
                image: 055357411429.dkr.ecr.eu-north-1.amazonaws.com/monad-backend:latest
                container_name: monad_app
                ports:
                  - "80:8000"
                environment:
                  APP_ENV: prod
                  APP_SECRET: ${{ secrets.APP_SECRET }}
                  DATABASE_URL: "postgresql://monad:monad_secure_pwd@postgres:5432/monad?serverVersion=16&charset=utf8"
                  JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
                  CORS_ALLOW_ORIGIN: "*"
                  AWS_S3_REGION: eu-central-1
                  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
                  AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
                  AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
                networks:
                  - monad_network
                depends_on:
                  postgres:
                    condition: service_healthy

            volumes:
              postgres_data:

            networks:
              monad_network:
                driver: bridge
            COMPOSE

            # Pull latest and restart
            docker-compose pull app
            docker-compose up -d

            # Run migrations after app starts
            sleep 15
            docker-compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction || true
