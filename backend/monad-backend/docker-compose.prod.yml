services:
  postgres:
    image: postgres:16-alpine
    container_name: monad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monad}
      POSTGRES_USER: ${POSTGRES_USER:-monad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monad_network
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-monad}", "-U", "${POSTGRES_USER:-monad}"]
      timeout: 5s
      retries: 5
      start_period: 60s
      interval: 10s

  app:
    image: 055357411429.dkr.ecr.eu-north-1.amazonaws.com/monad-backend:latest
    container_name: monad_app
    restart: unless-stopped
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      # Symfony core
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      # Database
      DATABASE_URL: "postgresql://${POSTGRES_USER:-monad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-monad}?serverVersion=16&charset=utf8"
      # JWT
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      # CORS
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-*}
      # AWS S3
      HETZNER_S3_REGION: ${HETZNER_S3_REGION:-eu-north-1}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_PRESIGNED_URL_EXPIRY: ${HETZNER_S3_PRESIGNED_URL_EXPIRY:-+15 minutes}
    volumes:
      - jwt_keys:/var/www/html/config/jwt
    networks:
      - monad_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  jwt_keys:

networks:
  monad_network:
    driver: bridge
