security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        register:
            pattern: ^/api/auth/register
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # The management interface. Stateful on purpose, unlike everything above it: the API is
        # JWT-bearer because phones hold their own token, but a browser session is what a human
        # operator has, and storing a JWT in localStorage to fake one would be a downgrade.
        # Session cookies also mean the logout below actually ends the session server-side.
        #
        # Reachability is narrowed a second time outside the application: nginx serves /admin only
        # to the Headscale tailnet (roles/monad_api). Login is the authentication; the tailnet is
        # the reason a credential-stuffing bot never reaches the login at all.
        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login

        main:
            lazy: true
            provider: app_user_provider

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Role hierarchy - superadmin has all permissions
    role_hierarchy:
        ROLE_SUPERADMIN: [ROLE_USER]

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # The login form itself must be reachable by someone not yet logged in; everything else
        # under /admin is superadmin-only. ROLE_USER is every registered participant, so the
        # management interface would otherwise be open to anyone who signed up in the app.
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SUPERADMIN }

        # Liveness must not require a token: the container HEALTHCHECK, the host nginx upstream
        # probe and any uptime monitor all call it unauthenticated, and a 401 reads as "down".
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/quests$, roles: PUBLIC_ACCESS }
        - { path: ^/api/quest/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_SUPERADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
